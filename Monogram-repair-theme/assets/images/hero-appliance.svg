<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" role="img" aria-label="Monogram front-loading washing machine">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dee2e6"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="40%" stop-color="#0d1b35"/>
      <stop offset="100%" stop-color="#0a1228"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
    <radialGradient id="gloss" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="drum-light" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e3a6e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1228" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0d1b35" flood-opacity="0.30"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d1b35" flood-opacity="0.18"/>
    </filter>
    <clipPath id="body-clip">
      <rect x="28" y="38" width="404" height="432" rx="22"/>
    </clipPath>
  </defs>

  <!-- Machine body -->
  <rect x="28" y="38" width="404" height="432" rx="22" fill="url(#body)" filter="url(#shadow)"/>

  <!-- Top control panel area -->
  <rect x="28" y="38" width="404" height="100" rx="22" fill="url(#panel)" clip-path="url(#body-clip)"/>
  <rect x="28" y="100" width="404" height="38" fill="url(#panel)"/>

  <!-- Panel divider line -->
  <line x1="28" y1="138" x2="432" y2="138" stroke="#bdc3cb" stroke-width="1.5"/>

  <!-- Control panel elements -->
  <!-- Dial 1 (program selector) -->
  <circle cx="100" cy="88" r="28" fill="#fff" stroke="#bdc3cb" stroke-width="2" filter="url(#soft-shadow)"/>
  <circle cx="100" cy="88" r="20" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="100" cy="88" r="4"  fill="#c81028"/>
  <!-- Dial indicator -->
  <line x1="100" y1="88" x2="100" y2="71" stroke="#c81028" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dial tick marks -->
  <g stroke="#aaa" stroke-width="1.2">
    <line x1="100" y1="62" x2="100" y2="67"/>
    <line x1="119" y1="69" x2="116" y2="73"/>
    <line x1="126" y1="88" x2="121" y2="88"/>
    <line x1="119" y1="107" x2="116" y2="103"/>
    <line x1="100" y1="114" x2="100" y2="109"/>
    <line x1="81"  y1="107" x2="84"  y2="103"/>
    <line x1="74"  y1="88"  x2="79"  y2="88"/>
    <line x1="81"  y1="69"  x2="84"  y2="73"/>
  </g>

  <!-- Digital display -->
  <rect x="158" y="60" width="144" height="56" rx="8" fill="#0d1b35" stroke="#3a4a60" stroke-width="1.5"/>
  <!-- Display glow -->
  <rect x="162" y="64" width="136" height="48" rx="6" fill="#0a2240"/>
  <!-- Display content -->
  <text x="230" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00e5ff" letter-spacing="3">1:24</text>
  <text x="230" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4dd0e1" letter-spacing="1.5">MONOGRAM</text>
  <!-- Display indicator dots -->
  <circle cx="174" cy="75" r="2.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="174" cy="86" r="2.5" fill="#26a69a" opacity="0.5"/>
  <circle cx="174" cy="97" r="2.5" fill="#26a69a" opacity="0.5"/>

  <!-- Dial 2 (temperature/speed) -->
  <circle cx="360" cy="88" r="28" fill="#fff" stroke="#bdc3cb" stroke-width="2" filter="url(#soft-shadow)"/>
  <circle cx="360" cy="88" r="20" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="360" cy="88" r="4"  fill="#1565c0"/>
  <line x1="360" y1="88" x2="373" y2="75" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
  <g stroke="#aaa" stroke-width="1.2">
    <line x1="360" y1="62"  x2="360" y2="67"/>
    <line x1="379" y1="69"  x2="376" y2="73"/>
    <line x1="386" y1="88"  x2="381" y2="88"/>
    <line x1="379" y1="107" x2="376" y2="103"/>
    <line x1="360" y1="114" x2="360" y2="109"/>
    <line x1="341" y1="107" x2="344" y2="103"/>
    <line x1="334" y1="88"  x2="339" y2="88"/>
    <line x1="341" y1="69"  x2="344" y2="73"/>
  </g>

  <!-- Small touch buttons row -->
  <g>
    <rect x="158" y="122" width="34" height="12" rx="3" fill="#0057a8"/>
    <text x="175" y="132" text-anchor="middle" font-family="Arial" font-size="7" fill="white" font-weight="600">START</text>
    <rect x="198" y="122" width="34" height="12" rx="3" fill="#fff" stroke="#bdc3cb" stroke-width="1"/>
    <text x="215" y="132" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">DELAY</text>
    <rect x="238" y="122" width="34" height="12" rx="3" fill="#fff" stroke="#bdc3cb" stroke-width="1"/>
    <text x="255" y="132" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">ECO</text>
    <rect x="278" y="122" width="34" height="12" rx="3" fill="#fff" stroke="#bdc3cb" stroke-width="1"/>
    <text x="295" y="132" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">SPIN</text>
  </g>

  <!-- ===== DOOR (main feature) ===== -->
  <!-- Outer chrome bezel -->
  <circle cx="230" cy="330" r="155" fill="url(#chrome)" filter="url(#soft-shadow)"/>
  <!-- Chrome ring highlight -->
  <circle cx="230" cy="330" r="155" fill="none" stroke="#e8e8e8" stroke-width="3"/>
  <circle cx="230" cy="330" r="149" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Rubber gasket ring -->
  <circle cx="230" cy="330" r="143" fill="#2a2a2a"/>
  <circle cx="230" cy="330" r="138" fill="#1a1a1a"/>

  <!-- Glass door -->
  <circle cx="230" cy="330" r="132" fill="url(#glass)"/>

  <!-- Drum holes pattern inside glass -->
  <g fill="rgba(255,255,255,0.07)" opacity="0.8">
    <!-- Inner drum pattern - concentric rings suggest -->
    <circle cx="230" cy="330" r="110" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <circle cx="230" cy="330" r="85"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <circle cx="230" cy="330" r="55"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

    <!-- Drum perforation dots (arranged in rings) -->
    <!-- Outer ring -->
    <circle cx="230" cy="222" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="277" cy="236" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="314" cy="268" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="328" cy="315" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="314" cy="362" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="277" cy="394" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="230" cy="408" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="183" cy="394" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="146" cy="362" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="132" cy="315" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="146" cy="268" r="3.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="183" cy="236" r="3.5" fill="rgba(255,255,255,0.12)"/>

    <!-- Mid ring -->
    <circle cx="230" cy="247" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="265" cy="253" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="293" cy="272" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="308" cy="302" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="308" cy="335" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="295" cy="363" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="270" cy="381" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="230" cy="388" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="190" cy="381" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="165" cy="363" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="152" cy="335" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="152" cy="302" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="167" cy="272" r="3" fill="rgba(255,255,255,0.1)"/>
    <circle cx="195" cy="253" r="3" fill="rgba(255,255,255,0.1)"/>

    <!-- Inner ring -->
    <circle cx="230" cy="275" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="252" cy="279" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="267" cy="295" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="271" cy="315" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="262" cy="336" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="246" cy="349" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="230" cy="352" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="214" cy="349" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="198" cy="336" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="189" cy="315" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="193" cy="295" r="2.5" fill="rgba(255,255,255,0.09)"/>
    <circle cx="208" cy="279" r="2.5" fill="rgba(255,255,255,0.09)"/>
  </g>

  <!-- Water/clothes hint inside drum (abstract wash effect) -->
  <ellipse cx="218" cy="345" rx="52" ry="35" fill="rgba(13,70,160,0.22)" transform="rotate(-15,218,345)"/>
  <ellipse cx="245" cy="318" rx="38" ry="28" fill="rgba(30,100,200,0.15)" transform="rotate(20,245,318)"/>

  <!-- Glass gloss overlay -->
  <circle cx="230" cy="330" r="132" fill="url(#gloss)"/>
  <!-- Specular highlight (top-left bright spot) -->
  <ellipse cx="185" cy="278" rx="38" ry="26" fill="white" opacity="0.07" transform="rotate(-20,185,278)"/>

  <!-- Door handle -->
  <rect x="360" y="318" width="18" height="24" rx="9" fill="url(#chrome)" stroke="#aaa" stroke-width="1"/>

  <!-- Machine body bottom area -->
  <!-- Detergent drawer -->
  <rect x="48" y="152" width="80" height="30" rx="4" fill="#dde0e5" stroke="#bdc3cb" stroke-width="1"/>
  <rect x="52" y="155" width="72" height="23" rx="3" fill="#c8cdd4"/>
  <text x="88" y="171" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">DETERGENT</text>

  <!-- Feet -->
  <rect x="68"  y="462" width="40" height="12" rx="4" fill="#8a9099"/>
  <rect x="352" y="462" width="40" height="12" rx="4" fill="#8a9099"/>

  <!-- Bottom service panel -->
  <rect x="28"  y="448" width="404" height="22" rx="0" fill="#d8dce2" clip-path="url(#body-clip)"/>
  <rect x="190" y="452" width="80"  height="14" rx="3" fill="#c0c4cb"/>
  <circle cx="230" cy="459" r="4" fill="#aaa"/>

  <!-- MONOGRAM LOGO (text) on door area -->
  <text x="230" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="800" fill="rgba(255,255,255,0.0)" letter-spacing="4">MONOGRAM</text>

  <!-- Certified badge overlay (bottom-right corner of image) -->
  <g transform="translate(312, 440)">
    <circle cx="50" cy="50" r="46" fill="#0057a8"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="50" y="42" text-anchor="middle" font-family="Arial" font-size="8"  fill="white" font-weight="600" letter-spacing="1">FACTORY</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="800" letter-spacing="0.5">CERTIFIED</text>
    <text x="50" y="68" text-anchor="middle" font-family="Arial" font-size="8"  fill="rgba(255,255,255,0.85)" letter-spacing="1">REPAIR</text>
    <!-- Star above -->
    <text x="50" y="31" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffd700">★</text>
  </g>
</svg>
